<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="description" content="A mobile-first photo sharing app demo inspired by social photo feeds.">
<title>InstaSphere — Social Photo App</title>
<style>
:root{--ink:#171717;--muted:#777;--line:#e8e8e8;--bg:#fff;--soft:#f7f7f7;--accent:#d9468f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{min-height:100dvh}.topbar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 975px)/2));position:sticky;top:0;background:#ffffffed;backdrop-filter:blur(12px);z-index:10}.brand{font-family:Georgia,serif;font-size:27px;font-weight:700;letter-spacing:-1.2px}.top-actions{display:flex;gap:18px;align-items:center}.icon{border:0;background:none;padding:3px;font-size:24px;line-height:1;color:var(--ink)}.search{border:1px solid var(--line);border-radius:9px;background:#f7f7f7;padding:9px 13px;width:220px;outline:none}.layout{max-width:975px;margin:26px auto;display:grid;grid-template-columns:minmax(0,615px) 293px;gap:35px;padding:0 12px}.stories{border:1px solid var(--line);border-radius:10px;padding:17px 14px;display:flex;gap:17px;overflow-x:auto;scrollbar-width:none;margin-bottom:22px}.stories::-webkit-scrollbar{display:none}.story{min-width:58px;text-align:center;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:7px;color:#333}.ring{width:58px;height:58px;padding:3px;border-radius:50%;background:linear-gradient(35deg,#ffc857,#f34c62,#c135d9,#6a5cff)}.ring img{width:100%;height:100%;border:2px solid white;border-radius:50%;object-fit:cover}.ring.self{background:#ddd}.post{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px;background:#fff}.post-head{height:59px;display:flex;align-items:center;padding:0 13px;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#eee}.user{font-weight:650;font-size:13px}.place{font-size:11px;color:#666;margin-top:2px}.dots{margin-left:auto;font-size:23px;letter-spacing:2px;border:0;background:none}.post-img{width:100%;display:block;max-height:690px;aspect-ratio:4/4.2;object-fit:cover;background:#eee}.post-actions{display:flex;align-items:center;gap:13px;padding:11px 13px 4px}.post-actions .icon{font-size:25px}.save{margin-left:auto}.likes,.caption,.comments,.time{padding:3px 13px;font-size:13px}.likes{font-weight:650}.caption{line-height:1.45}.caption b{margin-right:5px}.comments{color:#777;padding-top:3px}.time{font-size:10px;color:#888;padding-bottom:13px;text-transform:uppercase;letter-spacing:.4px}.comment-form{display:flex;border-top:1px solid var(--line);padding:10px 13px;gap:8px}.comment-form input{border:0;outline:0;flex:1;min-width:0}.comment-form button{border:0;background:none;color:#1685d5;font-weight:650}.side{position:sticky;top:86px;height:max-content}.side-user{display:flex;align-items:center;gap:12px;margin:4px 0 25px}.side-user img{width:45px;height:45px;border-radius:50%;object-fit:cover}.side-user small,.suggest small{display:block;color:#777;margin-top:4px}.switch{margin-left:auto;color:#1685d5;border:0;background:none;font-size:11px;font-weight:700}.suggest-title{display:flex;justify-content:space-between;color:#777;font-weight:650;font-size:13px;margin-bottom:17px}.suggest{display:flex;align-items:center;gap:10px;margin-bottom:14px}.suggest img{width:34px;height:34px;border-radius:50%;object-fit:cover}.suggest .switch{color:#1685d5}.footnote{font-size:11px;line-height:1.7;color:#c0c0c0;margin-top:25px}.mobile-nav{display:none}.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#222;color:white;padding:10px 16px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1}.empty{padding:50px 20px;text-align:center;color:#777}.modal-back{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:18px}.modal{background:#fff;border-radius:15px;padding:20px;width:min(430px,100%)}.modal h2{margin:0 0 14px;font-size:20px}.modal input,.modal textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;margin:6px 0;outline-color:#aaa}.modal textarea{min-height:85px;resize:vertical}.primary{width:100%;border:0;border-radius:8px;background:#1685d5;color:white;font-weight:700;padding:12px;margin-top:8px}.close{float:right;border:0;background:none;font-size:24px}.navtab{border:0;background:none;font-size:23px;padding:8px}.active{color:var(--accent)}.section-title{font-size:19px;margin:0 0 14px}.explore-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.explore-grid img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer}.profile-head{display:flex;gap:25px;align-items:center;padding:20px 8px 28px;border-bottom:1px solid var(--line);margin-bottom:12px}.profile-head img{width:85px;height:85px;border-radius:50%;object-fit:cover}.profile-head p{margin:7px 0;color:#555;font-size:13px}
@media(max-width:760px){.topbar{height:54px;padding:0 14px}.brand{font-size:25px}.search{display:none}.top-actions{gap:13px}.layout{display:block;margin:0 auto;padding:0;max-width:615px}.stories{border-left:0;border-right:0;border-radius:0;margin-bottom:10px;padding:14px 12px;gap:14px}.post{border-left:0;border-right:0;border-radius:0;margin-bottom:10px}.post-img{aspect-ratio:1/1;max-height:none}.side{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:58px;padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);justify-content:space-around;align-items:center;z-index:20}.toast{bottom:75px}.post-head{height:54px}}
</style>
</head>
<body><div class="app">
<header class="topbar"><a class="brand" href="#" onclick="showPage('home');return false">InstaSphere</a><input class="search" id="search" placeholder="Search people or captions…" aria-label="Search"><div class="top-actions"><button class="icon" aria-label="Home" onclick="showPage('home')">⌂</button><button class="icon" aria-label="Messages" onclick="showPage('messages')">➤</button><button class="icon" aria-label="Create post" onclick="openCreate()">⊞</button><button class="icon" aria-label="Explore" onclick="showPage('explore')">◎</button><button class="icon" aria-label="Profile" onclick="showPage('profile')">◉</button></div></header>
<div class="layout"><main id="main"></main><aside class="side"><div class="side-user"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt=""><div><b>suraj.creator</b><small>Suraj Arya</small></div><button class="switch" onclick="toast('Demo profile selected')">Switch</button></div><div class="suggest-title"><span>Suggested for you</span><button class="switch" onclick="toast('Showing all suggestions')">See All</button></div><div id="suggestions"></div><div class="footnote">About · Help · Press · API · Jobs · Privacy · Terms · Locations · Language<br><br>© 2026 INSTASPHERE DEMO</div></aside></div>
<nav class="mobile-nav"><button class="navtab active" onclick="showPage('home')">⌂</button><button class="navtab" onclick="showPage('explore')">⌕</button><button class="navtab" onclick="openCreate()">⊞</button><button class="navtab" onclick="showPage('reels')">▷</button><button class="navtab" onclick="showPage('profile')">◉</button></nav><div class="toast" id="toast"></div>
<div class="modal-back" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">×</button><h2>Create a post</h2><p style="font-size:12px;color:#777">Demo mode: add a public image URL. No password or private credentials are collected.</p><input id="postImage" placeholder="Image URL (https://…)" type="url"><input id="postLocation" placeholder="Location (optional)"><textarea id="postCaption" placeholder="Write a caption…"></textarea><button class="primary" onclick="publishPost()">Share post</button></div></div>
</div>
<script>
const people=[
{name:'mia.rose',img:'photo-1534528741775-53994a69daeb',sub:'Suggested for you'},
{name:'alex.travel',img:'photo-1500648767791-00dcc994a43e',sub:'Followed by creator'},
{name:'the.fooddiary',img:'photo-1524504388940-b1c1722653e1',sub:'New to InstaSphere'},
{name:'design.daily',img:'photo-1506794778202-cad84cf45f1d',sub:'Suggested for you'},
{name:'nina.moves',img:'photo-1517841905240-472988babdf9',sub:'Popular creator'}];
const seed=[
{user:'mia.rose',avatar:'photo-1534528741775-53994a69daeb',place:'Bali, Indonesia',img:'photo-1537996194471-e657df975ab4',caption:'Collect moments, not things. 🌴✨',likes:1248,time:'2 HOURS AGO'},
{user:'alex.travel',avatar:'photo-1500648767791-00dcc994a43e',place:'Dolomites, Italy',img:'photo-1464822759023-fed622ff2c3b',caption:'A little reminder to take the scenic route. ⛰️',likes:893,time:'5 HOURS AGO'},
{user:'the.fooddiary',avatar:'photo-1524504388940-b1c1722653e1',place:'Paris, France',img:'photo-1509042239860-f550ce710b93',caption:'Coffee first, everything else later ☕',likes:672,time:'1 DAY AGO'},
{user:'design.daily',avatar:'photo-1506794778202-cad84cf45f1d',place:'Studio',img:'photo-1497366754035-f200968a6e72',caption:'Make space for better ideas. ✍️',likes:412,time:'1 DAY AGO'}];
const img=(id,w=700)=>'https://images.unsplash.com/'+id+'?auto=format&fit=crop&w='+w+'&q=85';
let posts=JSON.parse(localStorage.getItem('instasphere_posts')||'null')||seed.map((p,i)=>({...p,id:i+1,liked:false,saved:false,comments:[]}));let nextId=Date.now();let page='home';
function persist(){localStorage.setItem('instasphere_posts',JSON.stringify(posts))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
function avatar(id){return img(id,100)}
function stories(){return '<div class="stories">'+[['Your story','photo-1535713875002-d1d0cf377cdf',true],...people.map(p=>[p.name,p.img,false])].map(s=>'<div class="story" onclick="toast(\'Stories are a visual demo\')"><div class="ring '+(s[2]?'self':'')+'"><img src="'+avatar(s[1])+'" alt=""></div><span>'+s[0]+'</span></div>').join('')+'</div>'}
function card(p){return '<article class="post"><div class="post-head"><img class="avatar" src="'+avatar(p.avatar)+'" alt=""><div><div class="user">'+esc(p.user)+'</div><div class="place">'+esc(p.place||'')+'</div></div><button class="dots" aria-label="More options" onclick="toast(\'More options coming soon\')">···</button></div><img class="post-img" src="'+(p.customImage?esc(p.img):img(p.img,900))+'" alt="Photo shared by '+esc(p.user)+'" loading="lazy" onclick="toast(\'Photo opened\')"><div class="post-actions"><button class="icon '+(p.liked?'active':'')+'" aria-label="Like" onclick="toggleLike('+p.id+')">'+(p.liked?'♥':'♡')+'</button><button class="icon" aria-label="Comment" onclick="document.getElementById(\'comment-'+p.id+'\').focus()">♧</button><button class="icon" aria-label="Share" onclick="sharePost('+p.id+')">➤</button><button class="icon save '+(p.saved?'active':'')+'" aria-label="Save" onclick="toggleSave('+p.id+')">'+(p.saved?'▣':'♧')+'</button></div><div class="likes">'+(p.likes+(p.liked?1:0)).toLocaleString()+' likes</div><div class="caption"><b>'+esc(p.user)+'</b>'+esc(p.caption)+'</div>'+(p.comments||[]).map(c=>'<div class="caption"><b>You</b>'+esc(c)+'</div>').join('')+'<div class="comments" onclick="document.getElementById(\'comment-'+p.id+'\').focus()">View all comments</div><div class="time">'+esc(p.time)+'</div><form class="comment-form" onsubmit="addComment(event,'+p.id+')"><input id="comment-'+p.id+'" placeholder="Add a comment…" maxlength="220" aria-label="Add a comment"><button type="submit">Post</button></form></article>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showPage(p){page=p;const m=document.getElementById('main');if(p==='home'){m.innerHTML=stories()+posts.map(card).join('')||'<div class="empty">No posts yet.</div>'}else if(p==='explore'){m.innerHTML='<h2 class="section-title">Explore</h2><div class="explore-grid">'+posts.map(x=>'<img src="'+(x.customImage?esc(x.img):img(x.img,400))+'" alt="'+esc(x.caption)+'" onclick="showPage(\'home\')">').join('')+people.map(x=>'<img src="'+avatar(x.img)+'" alt="Creator photo">').join('')+'</div>'}else if(p==='profile'){m.innerHTML='<div class="profile-head"><img src="'+avatar('photo-1535713875002-d1d0cf377cdf')+'"><div><h2 style="margin:0">suraj.creator</h2><p>0 posts shared by you · Demo profile</p><button class="primary" style="width:auto;padding:8px 18px" onclick="openCreate()">Create post</button></div></div><div class="explore-grid">'+posts.filter(x=>x.user==='suraj.creator').map(x=>'<img src="'+esc(x.img)+'">').join('')+'</div>'}else if(p==='messages'){m.innerHTML='<div class="empty"><div style="font-size:42px">➤</div><h2>Messages</h2><p>This demo does not connect to real users or send messages.</p><button class="primary" onclick="showPage(\'home\')">Back to feed</button></div>'}else if(p==='reels'){m.innerHTML='<div class="empty"><div style="font-size:42px">▷</div><h2>Reels</h2><p>Short-video browsing is a placeholder in this frontend demo.</p><button class="primary" onclick="showPage(\'explore\')">Explore photos</button></div>'}document.querySelectorAll('.navtab').forEach((b,i)=>b.classList.toggle('active',(['home','explore','create','reels','profile'][i]===p)));window.scrollTo({top:0,behavior:'smooth'})}
function toggleLike(id){const p=posts.find(x=>x.id===id);if(p){p.liked=!p.liked;persist();showPage(page)}}
function toggleSave(id){const p=posts.find(x=>x.id===id);if(p){p.saved=!p.saved;persist();showPage(page);toast(p.saved?'Saved to your collection':'Removed from saved')}}
function addComment(e,id){e.preventDefault();const input=document.getElementById('comment-'+id);if(!input.value.trim())return;const p=posts.find(x=>x.id===id);p.comments=p.comments||[];p.comments.push(input.value.trim());persist();showPage(page);toast('Comment added on this device')}
async function sharePost(id){const p=posts.find(x=>x.id===id);try{await navigator.clipboard.writeText(p.caption+' — InstaSphere demo');toast('Caption copied')}catch{toast('Share: '+p.caption)}}
function openCreate(){document.getElementById('modalBack').style.display='flex'}
function closeModal(){document.getElementById('modalBack').style.display='none'}
function publishPost(){const u=document.getElementById('postImage').value.trim(),c=document.getElementById('postCaption').value.trim(),loc=document.getElementById('postLocation').value.trim();if(!u.startsWith('https://')){toast('Please enter a valid HTTPS image URL');return}posts.unshift({id:nextId++,user:'suraj.creator',avatar:'photo-1535713875002-d1d0cf377cdf',place:loc,img:u,customImage:true,caption:c,likes:0,time:'JUST NOW',liked:false,saved:false,comments:[]});persist();closeModal();document.getElementById('postImage').value='';document.getElementById('postCaption').value='';document.getElementById('postLocation').value='';showPage('home');toast('Your demo post is live on this device')}
document.getElementById('suggestions').innerHTML=people.map(p=>'<div class="suggest"><img src="'+avatar(p.img)+'"><div><b style="font-size:12px">'+p.name+'</b><small>'+p.sub+'</small></div><button class="switch" onclick="this.textContent=this.textContent===\'Follow\'?\'Following\':\'Follow\'">Follow</button></div>').join('');
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();if(!q){showPage('home');return}page='home';document.getElementById('main').innerHTML=posts.filter(p=>(p.user+' '+p.caption+' '+p.place).toLowerCase().includes(q)).map(card).join('')||'<div class="empty">No matching posts found.</div>'});
showPage('home');
</script></body></html>
