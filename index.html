<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurajAN_Pro_Max | PDF Store OS v14</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #090d16; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 25px; border-radius: 16px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        h1 { font-size: 1.6rem; color: #38bdf8; margin-bottom: 4px; font-weight: 700; }
        p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 14px; }
        .badge { display: inline-block; background: rgba(56, 189, 248, 0.1); color: #38bdf8; padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-bottom: 14px; border: 1px solid rgba(56, 189, 248, 0.2); }
        .store-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; text-align: left; }
        .store-item { background: rgba(15, 23, 42, 0.6); padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.8rem; color: #cbd5e1; display: flex; justify-content: space-between; align-items: center; }
        .item-info { max-width: 70%; }
        .item-title { color: #38bdf8; font-weight: 600; margin-bottom: 2px; }
        .item-price { font-weight: bold; color: #34d399; }
        .clock-box { background: rgba(15, 23, 42, 0.6); padding: 8px; border-radius: 10px; margin-bottom: 14px; border: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.8rem; color: #38bdf8; font-weight: 600; }
        .btn { display: block; width: 100%; padding: 10px; background: #38bdf8; color: #0f172a; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; transition: background 0.2s; margin-bottom: 6px; }
        .btn:hover { background: #0ea5e9; }
        .btn-secondary { background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.2); font-size: 0.8rem; padding: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">🌐 PDF STORE OS v14 (Autonomous)</div>
        <h1>SurajAN_Pro_Max</h1>
        <p>Device-Independent Cloud Store</p>
        
        <div class="store-list">
            <div class="store-item">
                <div class="item-info">
                    <div class="item-title">Autonomous Playbook</div>
                    <div>Instant Strategy Guide</div>
                </div>
                <div class="item-price">FREE</div>
            </div>
            <div class="store-item">
                <div class="item-info">
                    <div class="item-title">Shorts Viral Blueprint</div>
                    <div>Content Mastery</div>
                </div>
                <div class="item-price">₹99</div>
            </div>
        </div>

        <div class="clock-box" id="live-clock">Loading Time...</div>

        <a href="playbook.md" target="_blank" class="btn">📥 Access Playbook</a>
        <a href="blueprint.md" target="_blank" class="btn">🚀 Access Viral Blueprint</a>
        <a href="https://github.com/anshikaarya639619-del/SurajAN_Pro_Max" target="_blank" class="btn btn-secondary">⚡ Source Code</a>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = '🕒 ' + now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
