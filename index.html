<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurajAN_Pro_Max | Command Center v3</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #090d16; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        h1 { font-size: 1.8rem; color: #38bdf8; margin-bottom: 8px; font-weight: 700; letter-spacing: -0.5px; }
        p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 20px; }
        .badge { display: inline-block; background: rgba(56, 189, 248, 0.1); color: #38bdf8; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 20px; border: 1px solid rgba(56, 189, 248, 0.2); }
        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .metric-box { background: rgba(15, 23, 42, 0.6); padding: 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .metric-value { font-size: 1.1rem; font-weight: bold; color: #f8fafc; }
        .metric-label { font-size: 0.75rem; color: #64748b; margin-top: 4px; }
        .progress-container { background: rgba(15, 23, 42, 0.6); padding: 14px; border-radius: 10px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.05); text-align: left; }
        .progress-label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .progress-bar { background: #0f172a; height: 8px; border-radius: 4px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); }
        .progress-fill { background: #38bdf8; height: 100%; width: 75%; border-radius: 4px; }
        .btn { display: block; width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; transition: background 0.2s; margin-top: 10px; }
        .btn:hover { background: #0ea5e9; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">⚡ FULL SPEED AHEAD</div>
        <h1>SurajAN_Pro_Max</h1>
        <p>Execution Mode Active. Scaling Up.</p>
        
        <div class="metrics">
            <div class="metric-box">
                <div class="metric-value">100%</div>
                <div class="metric-label">Uptime</div>
            </div>
            <div class="metric-box">
                <div class="metric-value">v3.0</div>
                <div class="metric-label">Engine Build</div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-label"><span>Mission Progress</span><span>75%</span></div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <a href="https://github.com/anshikaarya639619-del" target="_blank" class="btn">GitHub Profile</a>
    </div>
</body>
</html>
