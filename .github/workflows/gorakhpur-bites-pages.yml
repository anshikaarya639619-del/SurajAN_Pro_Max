name: Deploy Gorakhpur Bites demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "github-website-demo/**"
      - ".github/workflows/gorakhpur-bites-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-website-demo
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
